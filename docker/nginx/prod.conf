# Traefik (LAN, http://pixelforge.test) and the Tailscale Funnel sidecar (https://pixelforge.<tailnet>.ts.net)
# both deliver requests here on port 80.

# Tailscale terminates TLS and talks plain HTTP to us, so we do not rely on it sending X-Forwarded-Proto:
# a Host ending in .ts.net can only have arrived over HTTPS; everything else (Traefik, LAN) is HTTP.
map $http_host $public_scheme {
    ~\.ts\.net(:\d+)?$ https;
    default http;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 2M;
    server_tokens off;

    # Docker DNS, re-read every 10 s: recreating `app` changes its IP and nginx must not keep the old one.
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Vite assets have a hash in their name: cache them forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_php app:9000;
        fastcgi_pass $upstream_php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO $public_scheme;
        # Laravel sends a Link header preloading every Vite chunk; the default 4k buffer is too small (502).
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
